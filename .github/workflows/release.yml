name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: psort-linux
            asset_name: psort-linux
          - os: windows-latest
            artifact_name: psort.exe
            asset_name: psort-windows.exe
          - os: macos-latest
            artifact_name: psort
            asset_name: psort-macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Build with PyInstaller
        run: |
          poetry run pyinstaller --onefile --name psort --paths src src/main.py

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: move dist/psort.exe dist/${{ matrix.asset_name }}
        shell: cmd

      - name: Rename artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: mv dist/psort dist/${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
