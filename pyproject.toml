[tool.poetry]
package-mode = false

[project]
name = "psort"
version = "0.1.0"
description = ""
authors = [
    {name = "Boris Prymost",email = "borisprymost@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pillow (>=12.1.0,<13.0.0)",
    "hachoir (>=3.3.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "autopep8 (>=2.3.2,<3.0.0)",
    "pyinstaller (>=6.11.1,<7.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
